[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chiroflux"
version = "0.1.0"
description = "Collective-variable analysis for TIS/RETIS path sampling: SHAP, effect sizes, PCA and DeepTDA"
readme = "README.md"
requires-python = ">=3.10"
# authors = [{ name = "Your Name", email = "you@example.org" }]
keywords = [
    "infretis",
    "transition-interface-sampling",
    "path-sampling",
    "collective-variables",
    "shap",
    "molecular-dynamics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.5",
    "shap>=0.44",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "typer>=0.12",
    "tomli>=2.0",
]

[project.optional-dependencies]
# The DeepTDA stack is heavy and only needed by `chiroflux train-deeptda`.
deeptda = [
    "torch>=2.0",
    "lightning>=2.0",
    "mlcolvar>=1.3",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
chiroflux = "chiroflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
ignore = [
    # The analysis modules declare long, self-documenting typer.Option
    # annotations that read better on one line than wrapped.
    "E501",
    # `l` and `d` are the L/D enantiomers throughout, not sloppy names.
    "E741",
]
