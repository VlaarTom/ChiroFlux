# Histogram binning for `chiroflux histograms`.
#
# One entry per CV column:  "<column name>" = [min, max, n_bins]
#
# These ranges are per-simulation - each run covers a different OP window and
# different CV spreads - which is why they live here rather than in the code.
# Point the command at this file with -ranges; copy it per simulation and edit
# the copy.
#
# Only columns listed here are histogrammed. A column present in the CV files
# but absent here is skipped; a column listed here but missing from the data is
# reported when the run starts.

[ranges]
"OP_Lamb" = [-25, -13.5, 125]
"Mem_APL" = [0.6, 0.9, 60]
"PRO_RMS" = [0, 0.05, 50]
"Water" = [0, 35, 35]
