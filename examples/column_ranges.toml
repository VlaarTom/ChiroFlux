# Local chain tilt: cosine against +z, so the upper leaflet sits near -1 and
# the lower near +1. tiltN is the number of glycerols in the patch, an integer:
# the half-integer edges put one bin on each count.
"Mem_u_tilt" = [-1, 1, 40]
"Mem_l_tilt" = [-1, 1, 40]
"Mem_u_tiltN" = [-0.5, 12.5, 13]
"Mem_l_tiltN" = [-0.5, 12.5, 13]
"PRO_mode_ring" = [-1, 1, 40]
