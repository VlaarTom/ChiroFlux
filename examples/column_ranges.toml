"PRO_mode_N" = [-1, 1, 40]

# Membrane distortion and water defect around the permeant.
#   nP       phosphates inside the 1 nm disc behind Mem_*_def (integer)
#   defDeep  z-displacement (nm) of the deepest phosphates in the patch
#   curvH    mean curvature H (1/nm) of the leaflet's phosphate surface
#   wire     1 if the permeant's water reaches water outside the core, else 0
#   cluster  core waters connected to the permeant (integer). Rare frames hold
#            more than 60; they are reported as out of range, not dropped
#            silently, and the tail matters less than the bulk here.
"Mem_u_nP" = [-0.5, 12.5, 13]
"Mem_l_nP" = [-0.5, 12.5, 13]
"Mem_u_defDeep" = [-1.25, 1.25, 50]
"Mem_l_defDeep" = [-1.25, 1.25, 50]
"Mem_u_curvH" = [-2.5, 2.5, 50]
"Mem_l_curvH" = [-2.5, 2.5, 50]
"Water_wire" = [-0.5, 1.5, 2]
"Water_cluster" = [-0.5, 60.5, 61]
"PRO_dih_chi1" = [-60, 60, 120]
"PRO_dih_chi2" = [-60, 60, 120]
# Ring N-H side (H01-N-CA-C), intramolecular H...acceptor distances (nm),
# choline N+ at the carboxyl O / ring N (counts).
"PRO_dih_NH" = [-180, 180, 72]
"PRO_rHB_NH_O" = [0.15, 0.45, 60]
"PRO_rHB_NH_O01" = [0.15, 0.45, 60]
"PRO_rHB_OH_N" = [0.15, 0.45, 60]
